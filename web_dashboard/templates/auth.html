<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ 'Create account' if registering else 'Sign in' }} · VitalWave</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#172b4d;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.identity{background:#142d57;color:white;padding:65px;display:flex;flex-direction:column;justify-content:space-between}.logo{font-size:28px;font-weight:700;letter-spacing:-1px}.identity h1{font-size:clamp(40px,5vw,76px);font-weight:500;letter-spacing:-3px;max-width:500px}.identity small{letter-spacing:2px;font-size:11px;color:#b5c9ec}.wave{width:100%;height:160px;color:#83b4ff}.form-area{display:grid;place-items:center;padding:40px}.card{width:100%;max-width:380px}h2{font-size:30px;letter-spacing:-1px;margin:0 0 35px}label{display:block;font-size:14px;margin:20px 0 9px}input{width:100%;border:1px solid #cbd7e9;background:white;border-radius:7px;padding:14px;font:inherit}button{width:100%;margin-top:28px;padding:14px;border:0;border-radius:7px;background:#2563eb;color:white;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5}a{color:#2563eb}.alternate{margin-top:28px;padding-top:25px;border-top:1px solid #dce4f0;font-size:14px}.error{color:#a52a32;line-height:1.5}input:focus,button:focus,a:focus{outline:2px solid #2563eb;outline-offset:3px}@media(max-width:700px){.layout{grid-template-columns:1fr}.identity{padding:25px}.identity h1,.wave,.identity small{display:none}.form-area{padding:40px 25px}}
</style><script src="https://www.gstatic.com/firebasejs/6.0.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/6.0.0/firebase-auth.js"></script></head>
<body><div class="layout"><section class="identity"><div class="logo">VitalWave</div><div><h1>Research<br>workspace</h1><svg class="wave" viewBox="0 0 500 160" fill="none" aria-hidden="true"><path d="M0 80h80l25-18 24 36 28-70 35 110 30-58h55l23-28 25 48 30-75 35 105 27-50h83" stroke="currentColor" stroke-width="2"/></svg></div><small>BIG IDEAS LAB</small></section><main class="form-area"><div class="card"><h2>{{ 'Create account' if registering else 'Sign in' }}</h2><form id="auth-form">{% if registering %}<label for="name">Name</label><input id="name" autocomplete="name" required maxlength="100">{% endif %}<label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="{{ 'new-password' if registering else 'current-password' }}" required {% if registering %}minlength="6"{% endif %}><p id="error" class="error" role="alert"></p><button id="submit" type="submit">{{ 'Create account' if registering else 'Sign in' }}</button></form><div class="alternate">{% if registering %}<a href="/login">Sign in</a>{% else %}<a href="/register">Create an account</a>{% endif %}</div></div></main></div>
<script>const firebaseConfig = {
            apiKey: "AIzaSyDsd8grZqVOJyUSxtxBYgf52B7uoiT1mSw",
            authDomain: "vitalwave-test.firebaseapp.com",
            databaseURL: "vitalwave-test",
            projectId: "vitalwave-test",
            storageBucket: "vitalwave-test.firebasestorage.app",
            messagingSenderId: "14521597290",
            appId: "1:14521597290:web:0d90fa2a4650a4a2853913"
        };
firebase.initializeApp(firebaseConfig);
const registering={{ registering|tojson }}, form=document.getElementById('auth-form'), button=document.getElementById('submit'), error=document.getElementById('error');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;error.textContent='';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let credential;if(registering){credential=await firebase.auth().createUserWithEmailAndPassword(email,password);await credential.user.updateProfile({displayName:document.getElementById('name').value.trim()})}else{credential=await firebase.auth().signInWithEmailAndPassword(email,password)}const id_token=await credential.user.getIdToken(true);const response=await fetch('/attempt-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_token})});if(!response.ok)throw new Error('Could not sign in to the dashboard. Please try signing in again.');window.location.assign('/sessions')}catch(e){error.textContent=e.message||'Sign in failed.'}finally{button.disabled=false}});
</script></body></html>
