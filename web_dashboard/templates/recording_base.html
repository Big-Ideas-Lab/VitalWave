<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Sessions{% endblock %} · VitalWave</title>
<style>
:root{--ink:#172b4d;--muted:#63758f;--line:#dce4f0;--accent:#2563eb;--bg:#f4f7fc}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button,.button{cursor:pointer;border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:7px;color:var(--ink);display:inline-flex;align-items:center;gap:8px}button:hover,.button:hover{background:#edf3ff;text-decoration:none}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid var(--line);padding:32px 20px;display:flex;flex-direction:column;gap:40px}.brand{font-size:24px;font-weight:750;color:var(--ink);letter-spacing:-1px;display:flex;align-items:center;gap:10px}.brand svg{width:32px;height:32px;color:var(--accent)}.lab{font-size:10px;letter-spacing:2px;color:var(--muted);margin:12px 0 0 43px}nav{display:grid;gap:6px}nav a{padding:13px 16px;color:var(--muted);border-radius:7px}nav a[aria-current=page]{background:#eaf1ff;color:#1d4ed8;font-weight:650}aside footer{margin-top:auto;border-top:1px solid var(--line);padding-top:22px;display:grid;gap:14px}.account{overflow-wrap:anywhere;font-size:13px}.workspace{min-width:0}.topbar{height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:42px 40px}h1{font-size:34px;letter-spacing:-1.2px;margin:0}h2{font-size:17px;margin:0 0 22px}p{line-height:1.6}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 10px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:10px}.stat{padding:22px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:29px;font-weight:600;margin-top:12px}.panel{margin:22px 0;overflow:hidden}.panel-body{padding:26px}.toolbar{padding:20px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}input,select{border:1px solid var(--line);border-radius:6px;padding:11px 13px;color:var(--ink);background:white}input[type=search]{width:min(430px,100%)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#fafbfe;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}th,td{padding:18px 22px;border-bottom:1px solid #edf1f8}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfe}td a{font-weight:650}.badge{display:inline-block;font-size:12px;background:#eaf5ef;color:#246e4e;padding:5px 9px;border-radius:5px}.badge.neutral{background:#f0f2f3;color:#596c73}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.foot{padding:16px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}.split .panel{margin-top:0}dl{display:grid;grid-template-columns:150px 1fr;gap:18px;font-size:14px;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.note{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;max-width:500px}.back{display:inline-block;margin-bottom:22px;font-size:13px}details{margin-top:24px;color:var(--muted);font-size:12px}summary{cursor:pointer;margin-bottom:16px}code{font-size:12px;overflow-wrap:anywhere}time{font-variant-numeric:tabular-nums;font-size:13px}.metric{font-variant-numeric:tabular-nums}iframe{width:100%;border:0;min-height:1800px}[hidden]{display:none!important}@media(max-width:950px){.shell{grid-template-columns:170px 1fr}aside{padding:24px 12px}.brand{font-size:20px}.lab{margin-left:0}main{padding:28px 22px}.topbar{padding:0 22px}.split{grid-template-columns:1fr}}@media(max-width:650px){.shell{display:block}aside{padding:18px;gap:18px;border-right:0;border-bottom:1px solid var(--line)}aside nav{display:flex;flex-wrap:wrap;gap:0}aside footer{display:flex;margin:0;padding-top:12px;justify-content:space-between}.lab{display:none}.topbar{height:48px}main{padding:25px 16px}.heading{align-items:flex-start}h1{font-size:28px}.stats{gap:8px}.stat{padding:15px 12px}.stat strong{font-size:23px}.toolbar{flex-wrap:wrap}input[type=search]{width:100%}dl{grid-template-columns:110px 1fr}.panel-body{padding:20px}}
</style></head><body><div class="shell">
<aside><div><a class="brand" href="/sessions"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M5 17h6l3-8 4 15 3-7h6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>VitalWave</a><div class="lab">BIG IDEAS LAB</div></div>
<nav aria-label="Main navigation"><a href="/sessions" {% if request.path.startswith('/sessions') %}aria-current="page"{% endif %}>Sessions</a><a href="/visualize" {% if request.path == "/visualize" %}aria-current="page"{% endif %}>Visualize Data</a><a href="/dashboard" {% if request.path == '/dashboard' %}aria-current="page"{% endif %}>Analytics</a><a href="/settings" {% if request.path == '/settings' %}aria-current="page"{% endif %}>Account</a></nav>
<footer><span class="account">{{ name | default(session.get('user_email', '')) }}</span><a href="/logout">Sign out ↗</a></footer></aside>
<div class="workspace"><header class="topbar"><span>Research workspace</span><span>{{ name | default(session.get('user_email', '')) }}</span></header><main>{% block content %}{% endblock %}</main></div></div>
<script>document.querySelectorAll('time[datetime]').forEach(el=>{const d=new Date(el.dateTime);if(!isNaN(d)){el.textContent=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(d);el.title=d.toISOString()}});</script>
{% block scripts %}{% endblock %}</body></html>
