<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Login</title>
    <link rel="stylesheet" href="../static/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="../static/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="../static/css/demo_1/style.css" />
    <link rel="shortcut icon" href="../static/images/favicon.png" />
    <script src="https://www.gstatic.com/firebasejs/6.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/6.0.0/firebase-auth.js"></script>
</head>

<body>
    <div class="container-scroller">
        <div class="container-fluid page-body-wrapper full-page-wrapper">
            <div class="content-wrapper d-flex align-items-center auth">
                <div class="row flex-grow">
                    <div class="col-lg-4 mx-auto">
                        <div class="auth-form-light text-left p-5">
                            <h3>Login</h3>
                            <h6 class="font-weight-light">Sign in to continue.</h6>
                            <form class="pt-3" onsubmit="loginUser(event)">
                                <div class="form-group">
                                    <input type="email" class="form-control form-control-lg" id="exampleInputEmail1"
                                        placeholder="Email">
                                </div>
                                <div class="form-group">
                                    <input type="password" class="form-control form-control-lg"
                                        id="exampleInputPassword1" placeholder="Password">
                                </div>
                                <div class="mt-3">
                                    <a href="/dashboard">
                                        <button type="submit"
                                            class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn">Sign
                                            In</button>
                                    </a>
                                </div>
                                <div class="text-center mt-4 font-weight-light">
                                    Don't have an account? <a href="/register" class="text-primary">Create</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/vendors/js/vendor.bundle.base.js"></script>
    <script src="../static/js/off-canvas.js"></script>
    <script src="../static/js/hoverable-collapse.js"></script>
    <script src="../static/js/misc.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsd8grZqVOJyUSxtxBYgf52B7uoiT1mSw",
            authDomain: "vitalwave-test.firebaseapp.com",
            databaseURL: "vitalwave-test",
            projectId: "vitalwave-test",
            storageBucket: "vitalwave-test.firebasestorage.app",
            messagingSenderId: "14521597290",
            appId: "G-K1E1HJJKKB"
        };

        const app = firebase.initializeApp(firebaseConfig);

        function loginUser(event) {
            event.preventDefault();
            const email = document.getElementById('exampleInputEmail1').value;
            const password = document.getElementById('exampleInputPassword1').value;

            // console.log('Attempting login with Email:', email, 'Password:', password);

            // Inside loginUser function
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    userCredential.user.getIdToken().then((idToken) => {
                        //console.log('Generated ID Token:', idToken);
                        // Send token to your backend via HTTP
                        fetch('/attempt-login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ id_token: idToken, email: email })
                        })
                            .then(response => {
                                if (response.ok) {
                                    return response.json();
                                } else {
                                    throw new Error('Failed to log in');
                                }
                            })
                            .then(data => {
                                console.log('Backend Response Data:', data);
                                if (data.status === 'success') {
                                    window.location.href = '/dashboard';
                                } else {
                                    alert('Failed to log in: ' + data.message);
                                }
                            })
                            .catch(error => {
                                console.error('Error sending token to backend:', error);
                            });
                    });
                })
                .catch((error) => {
                    console.error('Error logging in user:', error);
                    alert('Error logging in user: ' + error.message);
                });

        }
    </script>

</body>

</html>
