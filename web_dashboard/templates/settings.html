{% extends 'recording_base.html' %}
{% block title %}Account{% endblock %}
{% block content %}<div class="heading"><h1>Account</h1></div><section class="panel panel-body" style="max-width:600px"><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="name">Name</label><input id="name" name="name" value="{{ profile.display_name or '' }}" required maxlength="100" style="display:block;width:100%;margin:12px 0 24px"><dl><dt>Email</dt><dd>{{ profile.email or '—' }}</dd></dl><button class="primary" style="margin-top:24px">Save changes</button>{% if saved %}<p role="status">Saved</p>{% endif %}</form></section>{% endblock %}
